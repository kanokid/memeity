
name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ----------------------------------------
  # 1. CI: Type-check, lint and test
  # ----------------------------------------
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type-check frontend
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # ----------------------------------------
  # 2. Create draft GitHub release
  # ----------------------------------------
  create-release:
    needs: ci
    runs-on: ubuntu-24.04

    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag does not match app version"
            exit 1
          fi

      - id: create
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `memeity ${tag}`,
              draft: true,
              prerelease: false,
              body: [
                "## Linux Downloads",
                "",
                "| Format | Package |",
                "|---|---|",
                "| AppImage | Portable Linux application |",
                "| Debian | .deb |",
                "| Fedora | .rpm |",
                "| Arch Linux | .pkg.tar.zst |",
                "",
                "Linux builds only. No Windows or macOS releases.",
                "",
                "These builds are not OS-code-signed."
              ].join("\n")
            });

            return data.id;

  # ----------------------------------------
  # 3. Build Linux packages
  # ----------------------------------------
  build-linux:
    needs: create-release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            jq \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Check required secrets
        shell: bash
        env:
          CLIENT_ID: ${{ secrets.MEMEITY_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MEMEITY_GOOGLE_CLIENT_SECRET }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in CLIENT_ID CLIENT_SECRET SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done

      # Build AppImage, DEB and RPM.
      - name: Build Linux packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          MEMEITY_GOOGLE_CLIENT_ID: ${{ secrets.MEMEITY_GOOGLE_CLIENT_ID }}
          MEMEITY_GOOGLE_CLIENT_SECRET: ${{ secrets.MEMEITY_GOOGLE_CLIENT_SECRET }}

          # Tauri updater signatures only, not OS code signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterSignatures: false
          args: "--bundles appimage,deb,rpm"

      # ----------------------------------------
      # 4. Build Arch Linux package
      # ----------------------------------------
      - name: Build application binary
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Prepare Arch package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          BIN_NAME=$(cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --no-deps \
            --format-version 1 |
            jq -r '.packages[] |
              select(.manifest_path | endswith("/src-tauri/Cargo.toml")) |
              .targets[] |
              select(.kind | index("bin")) |
              .name' | head -n 1)

          if [ -z "$BIN_NAME" ]; then
            echo "::error::Could not find application binary"
            exit 1
          fi

          mkdir -p dist/arch

          cp "src-tauri/target/release/$BIN_NAME" dist/arch/memeity

          cat > dist/arch/PKGBUILD <<EOF
          pkgname=memeity
          pkgver=$VERSION
          pkgrel=1
          pkgdesc="Memeity desktop application"
          arch=('x86_64')
          url="https://github.com/purestellenium/memeity"
          license=('custom')
          depends=('webkit2gtk-4.1' 'gtk3' 'libappindicator-gtk3')
          source=('memeity')
          sha256sums=('SKIP')

          package() {
            install -Dm755 "\$srcdir/memeity" "\$pkgdir/usr/bin/memeity"

            install -Dm644 /dev/stdin "\$pkgdir/usr/share/applications/memeity.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Memeity
          Comment=Memeity desktop application
          Exec=memeity
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          }
          EOF

      - name: Build .pkg.tar.zst
        run: |
          docker run --rm \
            -v "$PWD/dist/arch:/build" \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm base-devel

              useradd -m builder
              chown -R builder:builder /build

              su builder -c "cd /build && makepkg --cleanbuild --nodeps --noconfirm"
            '

      - name: Upload Arch package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/arch/*.pkg.tar.zst \
            --clobber

      # ----------------------------------------
      # 5. Release summary
      # ----------------------------------------
      - name: List release packages
        run: |
          echo "## Linux release packages" >> "$GITHUB_STEP_SUMMARY"

          find src-tauri/target/release/bundle dist/arch \
            -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -printf '- %f\n' >> "$GITHUB_STEP_SUMMARY"
