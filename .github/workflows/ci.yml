# Type-check, lint and test on both platforms memeity ships for (macOS also compiles
# the Mac-only code). Runs on pull requests, before every release build (the Release
# workflow calls it), or by hand (Actions > CI > Run workflow). Not on plain commits.
name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  # `ci-` prefix so a release's CI run doesn't share (and cancel) the Release group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type-check frontend
        run: npm run check

      # Also produces dist/, which the Rust build embeds.
      - name: Build frontend
        run: npm run build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # The Intel Mac release build leaves out OCR; make sure that still compiles.
      - name: Clippy (without OCR)
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-default-features -- -D warnings
