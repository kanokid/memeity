[package]
name = "memeity"
version = "0.1.0"
description = "One meme folder, everywhere, with a Raycast-style search pane"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (cargo#8519).
name = "memeity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Google Drive sync
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "macros"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
trash = "5"
humantime = "2"
# Search index (per device, never synced): SQLite with FTS5 for text found in images.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
nucleo-matcher = "0.3"
walkdir = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tauri-plugin-autostart = "2"
enigo = "0.6"
# OCR: PaddleOCR (PP-OCRv6) models on ONNX Runtime. Needs Rust 1.95+.
oar-ocr = "0.10"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Instant insert: save/restore the clipboard and refocus the previous app.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# Turning the pane's hide animation on/off (DWM). Same `windows` version Tauri uses.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# macOS: re-apply the Dock icon after switching between menu-bar-only and Dock modes.
# Same versions Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# `tauri dev` builds are unoptimized, which makes image decoding/encoding ~50x slower
# (seconds per copy for big memes). Optimize dependencies only; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
